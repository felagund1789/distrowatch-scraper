name: Weekly DistroWatch Scrape

on:
  schedule:
    # Runs weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

jobs:
  scrape:
    name: Run scraper and commit results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper (forced update mode)
        run: node index.js --update --force

      - name: Commit results if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/distros.json || true
          git add data/images || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(scrape): automated update of distros.json and images [ci skip]"
          git push
